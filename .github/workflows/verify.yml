name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository
        run: sh plugins/sol-advisor/scripts/verify.sh
      - name: Dependency and model scan
        shell: bash
        run: |
          legacy_pattern='GPT-5''\.6|gpt-5''\.6|5''\.6-sol|5''\.6-luna|5''\.6-terra|Ter''ra'
          echo "Legacy references (migration-detection fixture may remain):"
          rg -n -i "$legacy_pattern" . || true
          echo "Concrete model assignments:"
          rg -n 'model\s*=' .
          test "$(rg -n 'model\s*=' . | wc -l)" -eq 1
      - name: Git state
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat
