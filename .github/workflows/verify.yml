name: Verify Sol Advisor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Repository verifier
        run: sh plugins/sol-advisor/scripts/verify.sh

      - name: Required legacy and model-pin searches
        shell: bash
        run: |
          set -euo pipefail
          echo '--- retired generation search ---'
          if rg -n -i 'GPT-5\.6|gpt-5\.6|5\.6-sol|5\.6-luna|5\.6-terra|Terra' .             --glob '!plugins/sol-advisor/scripts/install-agents.sh'; then
            echo 'Unexpected retired runtime dependency found.' >&2
            exit 1
          fi

          echo '--- concrete model assignments ---'
          rg -n 'model\s*=' plugins/sol-advisor/agents
          test "$(rg -n 'model\s*=' plugins/sol-advisor/agents | wc -l)" -eq 1

      - name: Git scope checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
          git diff --stat origin/main...HEAD
